[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-orchestrator"
version = "0.1.0-dev"
description = "Multi-tier LLM orchestration system for cost-optimized AI development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "PairAdmin Team", email = "team@pairadmin.dev"}
]
maintainers = [
    {name = "MR-Krabs Contributors"}
]
keywords = ["llm", "orchestration", "ai", "cost-optimization", "budget-tracking", "openrouter", "crewai", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "click>=8.1.7",
    "structlog>=23.2.0",
    # CrewAI and MCP deps moved to optional extras below
]
    # fastapi and uvicorn moved to optional [mcp] extra for pure-library installs


[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "pre-commit>=3.6.0",
]
metrics = ["prometheus-client>=0.19.0"]
mcp = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]
crewai = ["crewai>=0.70.0,<1.0.0"]

[project.scripts]
cost-orchestrator = "src.cli.main:main"

[project.urls]
Homepage = "https://github.com/pairadmin/orchestrator"
Documentation = "https://github.com/pairadmin/orchestrator/docs"
Repository = "https://github.com/pairadmin/orchestrator.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

markers = [
    "external: tests requiring real API calls",
    "slow: tests that take >10 seconds",
    "e2e: end-to-end integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

