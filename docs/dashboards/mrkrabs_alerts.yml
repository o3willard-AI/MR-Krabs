groups:
  - name: mrkrabs_budget
    interval: 30s
    rules:
      - alert: BudgetWarning
        expr: (mrkrabs_budget_remaining_dollars / 10) * 100 < 20
        for: 1m
        labels:
          severity: warning
          service: mrkrabs
        annotations:
          summary: "MR-Krabs daily budget below 20%"
          description: "Budget at {{ $value | humanize }}% remaining ({{ $labels.instance }})"
          runbook_url: "https://github.com/o3willard-AI/MR-Krabs/docs/dashboards/ALERTING.md#budgetwarning"
      
      - alert: BudgetCritical
        expr: (mrkrabs_budget_remaining_dollars / 10) * 100 < 10
        for: 1m
        labels:
          severity: critical
          service: mrkrabs
        annotations:
          summary: "MR-Krabs daily budget critically low"
          description: "Budget at {{ $value | humanize }}% remaining ({{ $labels.instance }}). L2+ tiers blocked."
          runbook_url: "https://github.com/o3willard-AI/MR-Krabs/docs/dashboards/ALERTING.md#budgetcritical"
      
      - alert: BudgetExhausted
        expr: mrkrabs_budget_remaining_dollars <= 0
        for: 0m
        labels:
          severity: critical
          service: mrkrabs
        annotations:
          summary: "MR-Krabs daily budget EXHAUSTED"
          description: "All requests blocked on {{ $labels.instance }}. Budget resets at midnight UTC."
          runbook_url: "https://github.com/o3willard-AI/MR-Krabs/docs/dashboards/ALERTING.md#budgetexhausted"

  - name: mrkrabs_errors
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(mrkrabs_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: mrkrabs
        annotations:
          summary: "MR-Krabs error rate above 5%"
          description: "Error rate {{ $value | humanize }}/s over last 5 minutes ({{ $labels.instance }})"
          runbook_url: "https://github.com/o3willard-AI/MR-Krabs/docs/dashboards/ALERTING.md#higherrorrate"
      
      - alert: EscalationSpiral
        expr: rate(mrkrabs_tier_escalations_total[1m]) > 5
        for: 2m
        labels:
          severity: warning
          service: mrkrabs
        annotations:
          summary: "MR-Krabs escalation rate high — possible model outage"
          description: "{{ $value | humanize }} escalations/minute on {{ $labels.instance }}"
          runbook_url: "https://github.com/o3willard-AI/MR-Krabs/docs/dashboards/ALERTING.md#escalationspiral"

  - name: mrkrabs_health
    interval: 30s
    rules:
      - alert: AdapterUnhealthy
        expr: mrkrabs_health_status{status="down"} > 0
        for: 2m
        labels:
          severity: critical
          service: mrkrabs
        annotations:
          summary: "MR-Krabs adapter {{ $labels.adapter }} is DOWN"
          description: "Adapter {{ $labels.adapter }} on {{ $labels.instance }} has been down for 2 minutes."
          runbook_url: "https://github.com/o3willard-AI/MR-Krabs/docs/dashboards/ALERTING.md#adapterunhealthy"
