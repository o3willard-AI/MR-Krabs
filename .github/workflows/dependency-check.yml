name: "Dependency Health Check"

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install core package
      run: pip install -e .

    - name: Smoke test core
      run: python -c "from src.core.cost import Budget; print('Core OK')"

    - name: Install provider extras
      run: pip install -e ".[dev,anthropic,openai]"

    - name: Smoke test provider extras
      run: |
        python -c "import anthropic, openai; print('Provider SDKs OK')"
        python -c "from src.core.cost import Budget; print('Core OK')"