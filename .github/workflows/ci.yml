name: MR-Krabs CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-timeout pytest-cov requests
      
      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --tb=short --timeout=30 --cov=src.mcp --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        run: |
          pip install flake8 black isort
      
      - name: Run linters
        run: |
          echo "Running flake8..."
          flake8 src/ tests/ --max-line-length=120 --exclude=venv --count --select=E9,F63,F7,F82 --show-source --statistics
          
          echo "Checking black formatting..."
          black --check src/ tests/ || true
          
          echo "Checking isort imports..."
          isort --check-only src/ tests/ || true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install build tools
        run: |
          pip install build twine
      
      - name: Build package
        run: |
          if [ -f setup.py ] || [ -f pyproject.toml ]; then
            python -m build
            echo "Package built successfully"
          else
            echo "No setup.py or pyproject.toml found, skipping package build"
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mrkrabs-package
          path: dist/
          if-no-files-found: ignore

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    services:
      mrkrabs-server:
        image: python:${{ env.PYTHON_VERSION }}-slim
        ports:
          - 8000:8000
        options: >-
          --health-cmd="curl -f http://localhost:8000/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests
      
      - name: Start server in background
        run: |
          cd /home/sblanken/working/code/MR-Krabs || cd ${{ github.workspace }}
          uvicorn src.mcp.server:create_app --host 0.0.0.0 --port 8000 &
          echo "Server started, waiting..."
          sleep 10
      
      - name: Wait for server to be ready
        run: |
          MAX_RETRIES=30
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            
            sleep 1
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Waiting for server... ($RETRY_COUNT/$MAX_RETRIES)"
          done
          
          echo "Server failed to start"
          exit 1
      
      - name: Run integration tests
        run: |
          python -m pytest tests/integration_test.py -v --tb=short --timeout=30
      
      - name: Cleanup
        if: always()
        run: |
          pkill -f uvicorn || true

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [test, lint, integration-test]
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to dev environment
        run: |
          echo "Deploying to development environment..."
          # Add your deployment logic here
          # Example: rsync, scp, or cloud provider CLI
          echo "Dev deployment complete (placeholder)"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, lint, integration-test, build]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production environment
        run: |
          echo "Deploying to production environment..."
          # Add your deployment logic here
          # Example: cloud provider CLI, kubectl apply, etc.
          echo "Prod deployment complete (placeholder)"

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod]
    if: always()
    
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.integration-test.result }}" == "success" ]; then
            echo "✅ All checks passed!"
            
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then
              echo "🚀 Production deployment completed successfully"
            elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
              echo "🔧 Development deployment completed successfully"
            fi
          else
            echo "❌ Some checks failed"
            exit 1
          fi
